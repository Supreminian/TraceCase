[project]
name = "tracecase-prototype"
version = "0.3.0"
description = "Project-scoped testing Agent with traceable evidence, human review and resumable work"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.66,<2", "pydantic>=2.14,<3", "jsonschema>=4.26,<5", "markdown-it-py>=4.2,<5", "argon2-cffi>=25,<26", "starlette>=1.10,<2", "uvicorn>=0.54,<1", "httpx>=0.28,<1", "websockets>=15,<17", "python-multipart>=0.0.32,<1", "pillow>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
